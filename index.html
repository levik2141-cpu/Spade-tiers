<style>

:root[data-theme="light"] .rk.r0{color:#5f6b65}:root[data-theme="light"] .rk.r1{color:#14944a}:root[data-theme="light"] .rk.r2{color:#1479c4}:root[data-theme="light"] .rk.r3{color:#7a3fd1}:root[data-theme="light"] .rk.r4{color:#c4620a}

.prof{padding:6px 0 50px}
.back{background:var(--panel);border:1px solid var(--line);color:var(--gold);width:42px;height:42px;border-radius:12px;font-size:22px;cursor:pointer;margin-bottom:14px}

.pav{width:96px;height:96px;border-radius:16px;overflow:hidden;display:grid;place-items:center;font-size:40px;font-weight:800;color:#03160a;background:linear-gradient(135deg,var(--gold2),var(--deep));flex:none}

.pn{font-family:Impact,"Arial Black",sans-serif;font-size:34px;letter-spacing:.5px;word-break:break-all}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}

.pt{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px}

.pi{flex:1;min-width:0}.pi b{display:block;font-size:16px}
.pp{font-size:22px;font-weight:800;color:var(--gold)}.pp small{font-size:11px;color:var(--mute);margin-left:3px;font-weight:600}
#snd{font-size:16px}

.pl2{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:18px}
.ptop{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.ptop .pav{width:128px;height:128px;font-size:54px}
.pinfo{flex:1;min-width:220px}
.meta{display:flex;align-items:center;gap:10px;margin-top:8px}
.pb{margin-top:14px}
.pb .tb{width:48px}.pb .tb .ic{width:44px;height:44px}.pb .tb .ic img{width:30px;height:30px}.pb .tb .ic svg{width:25px;height:25px}.pb .tb .tt{font-size:12px}

.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 0}
.tl{display:flex;gap:6px}.tr{display:flex;gap:6px;justify-content:flex-end;align-items:center}
a.logo{text-decoration:none}
.credits{margin:22px auto 0;display:flex;flex-direction:column;gap:6px;color:var(--mute);font-size:16px}.credits b{color:var(--gold)}
.hbtn{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
a.x{text-decoration:none;display:inline-block}.x.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}

.t-h1{--rc:#ffc43d}.t-l1{--rc:#ff9a2e}.t-h2{--rc:#f4f5f7}.t-l2{--rc:#c9ced6}.t-h3{--rc:#d8935f}.t-l3{--rc:#b87a4c}.t-h4,.t-l4{--rc:#7f8a94}.t-h5,.t-l5{--rc:#5c666f}

.modes{flex-direction:column;overflow:visible;padding:0;position:sticky;top:12px;gap:8px}
.modes button{display:flex;align-items:center;gap:12px;font-size:17px;padding:12px 14px;text-align:left;width:100%}
.mi{width:30px;height:30px;display:grid;place-items:center;flex:none}.mi img{width:30px;height:30px;object-fit:contain}.mi svg{width:24px;height:24px}
.ovb{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:12px 16px;border-radius:12px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:8px}
.ovb.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#03160a;border-color:var(--gold)}
.ih{color:var(--gold);font-size:20px;margin:22px 0 10px}

.gm{display:flex;flex-wrap:wrap;gap:10px}.gm span{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700}

.info{padding-bottom:50px}
@media(max-width:760px){.tl2{grid-template-columns:1fr}.modes{flex-direction:row;overflow-x:auto;position:static}.modes button{width:auto;font-size:15px;white-space:nowrap}}
.empty{text-align:center;color:var(--mute);padding:40px 0}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--gold);border-radius:16px;padding:22px;width:min(440px,92vw)}

.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}

</style></head>

<script>
const MODES=["Crystal","UHC","Pot","NethPot","SMP","Sword","Axe","Mace","Spear Mace","Creeper","Bed","Money SMP","Cart"];
const TABS=["Overall",...MODES];
const PTS={HT1:60,LT1:44,HT2:32,LT2:22,HT3:16,LT3:10,HT4:6,LT4:4,HT5:2,LT5:1};
let P=[];
let mode="Overall";
const $=s=>document.getElementById(s);
$("q").oninput=$("rg").onchange=()=>render();
const ICONS={
"Sword":'<path d="M20 4l-9.5 9.5M7.5 10.5l6 6M10.5 13.5L5 19M4 20l2-2"/>',
"Axe":'<path d="M5 20L16 9"/><path d="M14 5c3-1 5 0 6 2l-3 4-5-3z"/>',

"Spear Mace":'<path d="M4 20L15 9M15 9l2-6 4 4z"/>',
"Crystal":'<path d="M12 2l6 7-6 13L6 9z"/><path d="M6 9h12M12 2v20"/>',

"SMP":'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/>',
"UHC":'<path d="M12 20s-7-4.500-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.500-7 10-7 10z"/>',
"Creeper":'<rect x="4" y="4" width="16" height="16" rx="1"/><path d="M8 8h3v3H8zM13 8h3v3h-3zM10 13h4v6h-1.500v-3h-1v3H10z"/>',
"Bed":'<path d="M3 18V8M3 14h18v4M21 14v-3a3 3 0 0 0-3-3h-6v6"/><circle cx="7" cy="11" r="1.600"/>',

const badge=(m,t)=>`<span class="tb ${t.toLowerCase()}" title="${m} ${t}"><span class="ic">${IMGS[m]?`<img src="${IMGS[m]}" alt="">`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[m]||""}</svg>`}</span><span class="tt">${t}</span></span>`;
function render(){
 const q=$("q").value.toLowerCase(),rg=$("rg").value;
 let L=P.filter(p=>(!rg||p.r===rg)&&p.n.toLowerCase().includes(q));
 if(mode==="Overall")L=L.map(p=>({...p,s:p.pts}));
 else L=L.filter(p=>p.t[mode]).map(p=>({...p,s:PTS[p.t[mode]]}));
 L.sort((a,b)=>b.s-a.s||a.n.localeCompare(b.n));
 $("list").innerHTML=L.length?L.map((p,i)=>`<button class="row r${i+1}" data-n="${p.n}"><div class="rank">${i+1}</div>
 <div class="who"><div class="av">${p.a?`<img src="${p.a}" alt="" loading="lazy" onerror="this.replaceWith('${p.n[0]}')">`:p.n[0]}</div><div style="min-width:0"><div class="nm">${p.n}<span class="reg ${p.r}">${p.r}</span></div><div class="sub"><span class="rk ${RANK(p.pts)[1]}">${RANK(p.pts)[0]}</span> · ${p.s} points</div><div class="badges">${mode==="Overall"?Object.entries(p.t).sort((a,b)=>PTS[b[1]]-PTS[a[1]]).map(([m,t])=>badge(m,t)).join(""):badge(mode,p.t[mode])}</div></div></div></button>`).join(""):`<div class="empty">No players match. Try a different name or region.</div>`;
}
$("list").onclick=e=>{const r=e.target.closest(".row");if(!r)return;window.__fromList=true;location.hash="#/p/"+encodeURIComponent(r.dataset.n)};
const ico=m=>IMGS[m]?`<img src="${IMGS[m]}" alt="">`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[m]||""}</svg>`;
function showProf(p){
 const rk=RANK(p.pts),own=Object.keys(p.t).length;
 const pos=[...P].sort((a,b)=>b.pts-a.pts||a.n.localeCompare(b.n)).indexOf(P.find(x=>x.n===p.n))+1;
 const cards=Object.entries(p.t).sort((a,b)=>PTS[b[1]]-PTS[a[1]]).map(([md,t])=>`<div class="tc t-${t.toLowerCase()}"><div class="big">${ico(md)}</div><b>${md}</b><div class="ring">${ico(md)}</div><div class="pill">${t}</div><small>${PTS[t]} pts</small></div>`).join("");
 $("prof").innerHTML=`<button class="back" id="bk" aria-label="Back to rankings">←</button>
 <div class="pl2"><div class="ptop"><div class="pav">${p.a?`<img src="${p.a}" alt="" onerror="this.replaceWith('${p.n[0]}')">`:p.n[0]}</div>
 <div class="pinfo"><div class="pn">${p.n}</div>
 <div class="meta"><span class="reg ${p.r}" style="margin:0">${p.r}</span><span class="rk ${rk[1]}" style="font-size:16px">${rk[0]}</span></div>
 <div class="stats" style="margin-top:14px"><div><b>#${pos}</b><span>Rank</span></div><div><b>${p.pts}</b><span>Points</span></div><div><b>${own}</b><span>Ranked in</span></div></div></div></div></div>
 <div class="tcards">${cards||'<div class="empty">No tiers yet.</div>'}</div>`;
 $("bk").onclick=()=>{if(window.__fromList)history.back();else location.hash="#/tiers"};
}
function buildTabs(){
 $("ovr").innerHTML=`<button class="ovb ${mode==="Overall"?"on":""}" data-m="Overall" role="tab">♠ Overall</button>`;
 $("modes").innerHTML=MODES.map(m=>`<button role="tab" data-m="${m}" class="${m===mode?"on":""}"><span class="mi">${ico(m)}</span>${m}</button>`).join("");
}
function setMode(m){mode=m;document.querySelectorAll("[data-m]").forEach(b=>b.classList.toggle("on",b.dataset.m===m));render()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(b)setMode(b.dataset.m)});
function buildInfo(){
 const pr=Object.entries(PTS).map(([t,v])=>`<tr><td><b>${t}</b></td><td>${v} pts</td></tr>`).join("");
 const rk=[["PvPer","r0","Under 20"],["Semi-PvPer","r1","20 – 49"],["Combat Pro","r2","50 – 74"],["Combat Legend","r3","75 – 149"],["Combat Master","r4","150 – 249"],["Combat Grandmaster","r5","250+"]].map(([n,c,r])=>`<tr><td><span class="rk ${c}">${n}</span></td><td>${r} pts</td></tr>`).join("");
 $("info").innerHTML=`<h2 class="ih">About SpadeTiers</h2>
 <div class="ic2"><p>SpadeTiers ranks Minecraft PvP players by testing them head-to-head in different gamemodes. Every player gets a tier in each gamemode they have been tested in, and all of their tiers add up to an overall score.</p></div>
 <h2 class="ih">How tiers work</h2>
 <div class="ic2"><p>Tiers run from <b>Tier 1</b> (the best) down to <b>Tier 5</b>. Each one is split into <b>High Tier (HT)</b> and <b>Low Tier (LT)</b>, so HT1 is the top and LT5 is the lowest.</p>
 <div class="two"><table>${pr}</table><div><p class="sub" style="margin:0 0 8px">Your overall points are the total from every gamemode you are tested in.</p></div></div></div>
 <h2 class="ih">Combat titles</h2>
 <div class="ic2"><p>Your total points decide your title, shown under your name.</p><table>${rk}</table></div>
 <h2 class="ih">Gamemodes</h2>
 <div class="ic2"><div class="gm">${MODES.map(m=>`<span><i>${ico(m)}</i>${m}</span>`).join("")}</div></div>
 <h2 class="ih">Get tested</h2>
 <div class="ic2"><p>Want a tier? Join the Discord to get tested.</p><a class="x" href="https://discord.gg/qbPpFDb3bc" target="_blank" rel="noopener noreferrer">Get tested</a></div>
 <p class="sub" style="text-align:center;margin-top:18px">Made by DawnMC23 · Owner of Spade Tiers: XclsFrogMC</p>`;
}
function route(){
 const hs=location.hash,m=hs.match(/^#\/p\/(.+)$/);
 const p=m&&P.find(x=>x.n.toLowerCase()===decodeURIComponent(m[1]).toLowerCase());
 const page=p?"p":hs.startsWith("#/tiers")?"t":hs.startsWith("#/info")?"i":"h";
 const show={h:["#home"],t:["#thero","#tl"],p:["#prof"],i:["#info"]}[page];
 for(const s of ["#home","#thero","#tl","#prof","#info"])document.querySelector(s).hidden=!show.includes(s);
 $("nh").classList.toggle("on",page==="h");$("nt").classList.toggle("on",page==="t"||page==="p");$("ni").classList.toggle("on",page==="i");
 if(p)showProf(p);
}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
$("th").onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue("--bg").trim()==="#0a0d0b";d.dataset.theme=dark?"light":"dark"};
let AC,muted=false;try{muted=localStorage.getItem("st-mute")==="1"}catch(e){}
function click(){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
 const t=AC.currentTime,v=1+(Math.random()-.5)*.06,out=AC.createGain();out.gain.value=.5;out.connect(AC.destination);
 [[660,0],[990,.05]].forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f*v;
  g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(.22,t+d+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d+.14);
  o.connect(g);g.connect(out);o.start(t+d);o.stop(t+d+.15)});
 const n=AC.createBuffer(1,AC.sampleRate*.02,AC.sampleRate),a=n.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);
 const s=AC.createBufferSource(),hp=AC.createBiquadFilter(),ng=AC.createGain();s.buffer=n;hp.type="highpass";hp.frequency.value=3500;ng.gain.value=.25;
 s.connect(hp);hp.connect(ng);ng.connect(out);s.start(t)}catch(e){}}
document.addEventListener("pointerdown",e=>{if(e.target.closest("button,a,select,input,.row,.pt,.pm"))click()},true);
$("snd").textContent=muted?"🔇":"🔊";
$("snd").onclick=()=>{muted=!muted;try{localStorage.setItem("st-mute",muted?"1":"0")}catch(e){}$("snd").textContent=muted?"🔇":"🔊";click()};
buildTabs();buildInfo();route();
async function load(){try{const r=await fetch("players.json?t="+Date.now());P=(await r.json()).map(p=>({...p,pts:Object.values(p.t).reduce((a,b)=>a+PTS[b],0)}))}catch(e){}render();route()}
load();setInterval(load,30000);
</script></body></html>
